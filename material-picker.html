<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script src="https://app.storyblok.com/f/storyblok-v2-latest.js"></script>
</head>
<body class="bg-transparent p-2">
  <div id="app" class="flex items-center gap-4 p-3 border border-gray-200 rounded-lg bg-white shadow-sm">
    <div class="w-12 h-12 flex items-center justify-center bg-blue-50 text-[#0052ff] rounded-lg border border-blue-100">
      <span id="preview" class="material-symbols-outlined text-3xl text-[#0052ff]">help</span>
    </div>

    <div class="flex-1">
      <input 
        type="text" 
        id="iconName" 
        placeholder="π.χ. directions_car" 
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-[#0052ff] focus:border-transparent"
      />
      <p class="text-[10px] text-gray-400 mt-1 uppercase font-semibold tracking-wider">Google Material Icon Name</p>
    </div>
  </div>

<script>
  // Συνάρτηση που αρχικοποιεί το plugin
  const initPlugin = () => {
    const { plugin } = window.storyblok;
    const input = document.getElementById('iconName');
    const preview = document.getElementById('preview');

    // 1. Φόρτωσε την τρέχουσα τιμή
    const currentValue = plugin.get().value || 'help';
    input.value = currentValue;
    preview.innerText = currentValue;

    // 2. Event listener για αλλαγές
    input.addEventListener('input', (e) => {
      const val = e.target.value.trim().toLowerCase();
      preview.innerText = val || 'help';
      plugin.set({ value: val });
    });
  };

  // ΠΕΡΙΜΕΝΟΥΜΕ να φορτώσει το Storyblok Bridge
  const checkStoryblok = () => {
    if (window.storyblok && typeof window.storyblok.init === 'function') {
      window.storyblok.init(() => initPlugin());
    } else {
      // Αν δεν είναι έτοιμο, ξαναδοκίμασε σε 100ms
      setTimeout(checkStoryblok, 100);
    }
  };

  checkStoryblok();
</script>
</body>
</html>
